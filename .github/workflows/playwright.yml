name: Playwright Tests

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

env:
  # override value from .env.testnet used in CI
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

jobs:
  test:
    timeout-minutes: 60
    # Pinned: ubuntu-latest now resolves to ubuntu-26.04, whose apt repos lack
    # the system packages (e.g. libicu74, libvpx9) that the pinned Playwright
    # version installs via `playwright install --with-deps`. Revisit when
    # Playwright is upgraded to a release that supports ubuntu-26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Pinned: lts/* now resolves to Node 26, on which Playwright 1.49.1's
          # browser install hangs after downloading Chromium. Node 24 is the
          # version used by the last green run.
          node-version: '24'
          cache: pnpm
      - name: Install packages
        run: pnpm install
      - name: Install Playwright browsers
        run: pnpm tests playwright:install
      - name: Set up testnet environment
        run: cp apps/dapp/.env.mainnet apps/dapp/.env.local
      - name: Build dApp
        run: pnpm dapp build
        env:
          # Public ubuntu-24.04 runners have 16 GB RAM; leave room outside V8.
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Run Playwright tests
        run: pnpm test:playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: packages/tests/playwright-report/
          retention-days: 30
