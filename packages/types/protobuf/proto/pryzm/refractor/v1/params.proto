syntax = "proto3";
package pryzm.refractor.v1;

import "amino/amino.proto";
import "pryzm/assets/v1/refractable_asset.proto";

option go_package = "github.com/pryzm-finance/pryzm-core/x/refractor/types/v1";

// Params defines the parameters for the module.
message Params {
  // the list of admin addresses, able to deposit cAssets to the refractor module
  repeated string admins = 1 [(amino.dont_omitempty) = true];
}
